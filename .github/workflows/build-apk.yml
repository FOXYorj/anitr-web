name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Compile Embedded Go Core (ARM64)
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o android/app/src/main/jniLibs/arm64-v8a/libanitr.so .
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libanitr.so

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk anitr-web-v8.3.5.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anitr-web-v8.3.5-apk
          path: anitr-web-v8.3.5.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.3.5-apk
          name: Anitr Web Standalone Android APK (v8.3.5)
          body: |
            📱 **Anitr Web Bağımsız Android APK**

            - 🚀 **Sunucusuz / Bağımsız:** Arka planda harici sunucu, bilgisayar veya localhost gerektirmez.
            - ⚡ **Gömülü Motor:** Telefon içinde çalışan yerel Go çekirdeği ile tam performans.
            - 🎬 **Video.js Tam Ekran:** Otomatik yatay ekran döndürme ve gezinme çubuğu gizleme.
            - 🔍 **Modern Arama & Sosyal Hub:** v8.3.5 sürümündeki tüm yeni özellikler dahildir.
          files: anitr-web-v8.3.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
